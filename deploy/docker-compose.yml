# HSR Textiles ERP - staging / production stack.
# Only Caddy (80/443) is reachable from outside. PostgreSQL and Odoo have NO published ports.
# All secrets come from the .env file (never commit it).

name: hsr-erp

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: odoo
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  odoo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: hsr-erp-odoo:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Kolkata}
      DB_NAME: ${DB_NAME}
      ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD:?set ODOO_MASTER_PASSWORD in .env}
      ODOO_WORKERS: ${ODOO_WORKERS:-2}
    # Odoo 19 reads the master password only from a config file, so it is written
    # inside the container at start-up from the .env secret (never stored in the image).
    command:
      - bash
      - -c
      - |
        umask 077
        printf '[options]\naddons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons\ndata_dir = /var/lib/odoo\nadmin_passwd = %s\ndb_host = db\ndb_user = odoo\ndb_password = %s\n' "$$ODOO_MASTER_PASSWORD" "$$PASSWORD" > /tmp/odoo.conf
        exec odoo -c /tmp/odoo.conf \
          --database="$$DB_NAME" --db-filter="^$$DB_NAME$$" --no-database-list \
          --proxy-mode --workers="$$ODOO_WORKERS" --max-cron-threads=1 \
          --limit-memory-soft=1073741824 --limit-memory-hard=1342177280 \
          --limit-time-cpu=120 --limit-time-real=240 --log-level=info
    volumes:
      - odoo-data:/var/lib/odoo
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8069/web/login', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  # Nightly backup (database + filestore) kept for BACKUP_KEEP_DAYS days.
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${DB_NAME}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      TZ: ${TZ:-Asia/Kolkata}
    entrypoint: ["/bin/bash", "/scripts/backup-loop.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - odoo-data:/var/lib/odoo:ro
      - ${BACKUP_DIR:-./backups}:/backups
    logging: *logging

  # Optional uptime / alert dashboard:  docker compose --profile monitoring up -d
  uptime-kuma:
    image: louislam/uptime-kuma:1
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - kuma-data:/app/data
    logging: *logging

volumes:
  pgdata:
  odoo-data:
  caddy-data:
  caddy-config:
  kuma-data:
